<!DOCTYPE html>
<html>
<head>
  <title>Reaction test</title>
  <style>

    #start_btn, #reset_btn {
        position: relative;
        margin: 20px;
        padding: 10px 18px;
        font-size: 16px;
    }
    img{
        position: absolute;
        width: 200px;
        height: 250px;
    }
    #result {
        position: absolute;
        display: none;
        font-size: 28px;
        text-align: center;
        z-index: 1;
    }
  </style>
</head>
<body>
    <nav>
        <a href="index.html">first page</a>
        <a href="game1.html">second page</a>
        <a href="Pan's game.html">third page</a>
        <a href="Qs.html">forth page</a>
    </nav>
    <h1>Let find out how fast you can click an image</h1>
    <button onclick="start()" id="start_btn">START~</button>

    <img src="pics/peter7.jpg" id="pic" style="display: none" onclick="click_pic()">
    <div id="result"></div>
    <script>
        let pic = document.getElementById('pic');
        let startBtn = document.getElementById('start_btn');
        let resultDiv = document.getElementById('result');

        let startTime = 0
        let gg = false


        function start() {
            if (gg) return;

            gg = true;
            resultDiv.style.display = 'none'
            pic.style.display = 'block';

            const maxX = window.innerWidth - pic.offsetWidth;
            const maxY = window.innerHeight - pic.offsetHeight;

            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            pic.style.left = `${randomX}px`;
            pic.style.top = `${randomY}px`;
            startTime = Date.now();
        }

        function click_pic() {
            if (!gg) {
                return
            }
            let reactionMs = Date.now() - startTime
            pic.style.display = 'none';
            gg = false;
            resultDiv.innerHTML = `You took ${reactionMs} ms`;
            resultDiv.style.display = 'block';

            let centerX = (window.innerWidth - resultDiv.offsetWidth) / 2;
            let centerY = (window.innerHeight - resultDiv.offsetHeight) / 2;
            resultDiv.style.left = `${centerX}px`;
            resultDiv.style.top = `${centerY}px`;
        }

    </script>
</body>
</html>
