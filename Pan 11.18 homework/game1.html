<h1>TH</h1>
    <p>Get 30 points before time runs out! Avoid mushrooms!</p>
    <div class="status">
        Score: <span id="score">0</span> | Time Left: <span id="timer">30</span>s
    </div>
    <div id="message"></div>

    <div class="game-area" id="gameArea">
      
      
        <img src='https://www.hobbydigi.com/media/catalog/product/cache/image/700x700/e9c3970ab036de70892d86c6d221abfe/1/6/1684383117_op01-091_p1.png?src=seo' width='200px' height="300px">
        <img src='https://tse2.mm.bing.net/th/id/OIP.2zYDULhOUcm9byWn3izISQHaKS?r=0&rs=1&pid=ImgDetMain&o=7&rm=3' width='200px' height="300px">
        <img src='https://asia-tw.onepiece-cardgame.com/images/events/2022/officialevents/national-teaching-tour/standard-01/02.png' width='200px' height="300px">
    </div>
    <button onclick="King()">king</button>
    <button onclick="Queen()">Queen</button>
    <button onclick="Son()">Son</button>
    <button onclick="resetGame()">Reset Game</button>


    <<script>
let score=0,timeLeft=30,timer,over=false;

setInterval(function(){
  if(over)return;
  timeLeft--;
  document.getElementById("timer").textContent=timeLeft;
  if(timeLeft<=0)end(false);
},1000);

function King(){
  if(over)return;
  score=score+10;
  document.getElementById("score").textContent=score;
  if(score>=30)end(true);
}

function Queen(){
  if(over)return;
  score=score-5;
  if(score<0)score=0;
  document.getElementById("score").textContent=score;
}

function Son(){
  resetGame();
}

function end(win){
  over=true;
  document.getElementById("message").textContent=win?"You Win!":"Game Over!";
}

function resetGame(){
  score=0;
  timeLeft=30;
  over=false;
  document.getElementById("score").textContent=score;
  document.getElementById("timer").textContent=timeLeft;
  document.getElementById("message").textContent="";
}
</script>
